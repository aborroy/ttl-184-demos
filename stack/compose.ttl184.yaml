# TTL #184 changes on top of compose.yaml (a pristine copy of acs-deployment
# docker-compose/pre-release-compose.yaml, 16 Nov 2026). Load order: compose.yaml, then this file.
#
# - alfresco: alfresco-access audit on, downloadContent events for explicit downloads (ACS 26.3),
#   cascading dictionaries for the three sample aspects (ACS 26.2+), sample model mounted.
#   JAVA_OPTS is restated in full because Compose replaces the whole value.
# - search, search-reindexing: compose.yaml pins 5.11.0-A.1, which is not on quay.io (23 Nov 2026).
#   5.10.0-A.6 (17 Nov) is the newest tag that exists.
# - activemq: same activemq.xml as the image, with the STOMP connector (61613) on, for `acs events`.
# - share, kibana, sync-service: not used in the demos. Kibana would also take port 5601.
services:
  alfresco:
    environment:
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dindex.subsystem.name=elasticsearch
        -Delasticsearch.createIndexIfNotExists=true
        -Delasticsearch.host=elasticsearch
        -Delasticsearch.port=9200
        -Dshare.host=localhost
        -Dshare.port=8080
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=http://localhost:8080/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Dmessaging.broker.username=admin
        -Dmessaging.broker.password=admin
        -Ddeployment.method=DOCKER_COMPOSE
        -Dtransform.service.enabled=true
        -Dtransform.service.url=http://transform-router:8095
        -Dsfs.url=http://shared-file-store:8099/
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -Ddsync.service.uris=http://localhost:9090/alfresco
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Daudit.enabled=true
        -Daudit.alfresco-access.enabled=true
        -Daudit.content.downloadPolicy=STANDARD
        -Dcd.aspects=cdict:department,cdict:account,cdict:location
    volumes:
      - ./cd/model/customDictModel.xml:/usr/local/tomcat/shared/classes/alfresco/model/customDictModel.xml:ro
      - ./cd/model/customDictModel-context.xml:/usr/local/tomcat/shared/classes/alfresco/extension/customDictModel-context.xml:ro
  search:
    image: quay.io/alfresco/alfresco-elasticsearch-live-indexing:5.10.0-A.6
  search-reindexing:
    image: quay.io/alfresco/alfresco-elasticsearch-reindexing:5.10.0-A.6
  activemq:
    volumes:
      - ./activemq/activemq.xml:/opt/activemq/conf/activemq.xml:ro
  share:
    profiles: [unused]
  kibana:
    profiles: [unused]
  sync-service:
    profiles: [unused]
